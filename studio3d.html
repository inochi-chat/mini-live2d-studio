
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171824">

  <title>Inochi 3D Studio</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div id="app">

  <header class="topbar">
    <button id="menuButton">☰</button>

    <div class="brand">
      <strong>INOCHI 3D</strong>
      <small>3D MODELING STUDIO</small>
    </div>

    <button id="saveButton">保存</button>
    <button id="loadButton">読込</button>
  </header>

  <main id="workspace">

    <section id="viewport">

      <canvas id="threeCanvas"></canvas>

      <div class="viewport-label">
        PERSPECTIVE
      </div>

      <div id="objectCount">
        Objects: 0
      </div>

    </section>

    <section id="bottomPanel">

      <div class="panel-handle"></div>

      <div class="tool-row">
        <button id="undoButton">↶ 元に戻す</button>
        <button id="redoButton">↷ やり直す</button>
      </div>

      <div class="tool-row">
        <button id="addButton">＋ 追加</button>
        <button id="moveButton">移動</button>
        <button id="rotateButton">回転</button>
        <button id="scaleButton">拡縮</button>
      </div>

      <div class="tool-row">

        <button id="objectModeButton" class="active">
          オブジェクト
        </button>

        <button id="vertexModeButton">
          頂点
        </button>

        <button id="edgeModeButton">
          辺
        </button>

        <button id="faceModeButton">
          面
        </button>

      </div>

      <!-- 押し出し操作 -->

      <div class="tool-row">

        <button id="extrudeButton">
          面を押し出す
        </button>

        <div class="extrude-control">

          <label for="extrudeDistance">
            押し出す距離
          </label>

          <input
            type="number"
            id="extrudeDistance"
            value="0.5"
            min="-10"
            max="10"
            step="0.1"
          >

        </div>

      </div>

      <div class="section-title">
        オブジェクト
      </div>

      <div id="objectList">
        <p class="empty-message">
          オブジェクトがありません
        </p>
      </div>

      <div class="tool-row secondary">
        <button id="duplicateButton">複製</button>
        <button id="deleteButton">削除</button>
      </div>

      <div id="properties">

        <div class="section-title">
          プロパティ
        </div>

        <p>
          オブジェクトを選択してください
        </p>

      </div>

    </section>

  </main>

</div>

<input
  type="file"
  id="loadFileInput"
  accept=".json,application/json"
  hidden
>

<script type="module" src="js/main.js"></script>

</body>
</html>
